name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect CI scope
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.scope.outputs.contracts }}
      backend: ${{ steps.scope.outputs.backend }}
      web: ${{ steps.scope.outputs.web }}
      admin: ${{ steps.scope.outputs.admin }}
    steps:
      - uses: actions/checkout@v4

      - id: scope
        name: Inspect directories and lockfiles
        run: |
          set -euo pipefail

          has_contracts=false
          if [ -d contracts ] && [ -n "$(find contracts -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) -print -quit)" ]; then
            has_contracts=true
          else
            echo "::warning::contracts job skipped: contracts YAML/JSON not present yet"
          fi

          has_backend=false
          if [ -f backend/pom.xml ]; then
            has_backend=true
          else
            echo "::warning::backend job skipped: backend/pom.xml not present yet"
          fi

          ws_lock=false
          if [ -f apps/package-lock.json ] || [ -f apps/pnpm-lock.yaml ] || [ -f apps/yarn.lock ]; then
            ws_lock=true
          fi

          web_ready=false
          if [ ! -f apps/web/package.json ]; then
            echo "::warning::web job skipped: apps/web/package.json not present yet"
          elif [ -f apps/web/pnpm-lock.yaml ] || [ -f apps/web/package-lock.json ] || [ -f apps/web/yarn.lock ] || [ "$ws_lock" = true ]; then
            web_ready=true
          else
            echo "::warning::web job skipped: apps/web has package.json but no lockfile at apps/ or apps/web/ (will not npm install)"
          fi

          admin_ready=false
          if [ ! -f apps/admin/package.json ]; then
            echo "::warning::admin job skipped: apps/admin/package.json not present yet"
          elif [ -f apps/admin/pnpm-lock.yaml ] || [ -f apps/admin/package-lock.json ] || [ -f apps/admin/yarn.lock ] || [ "$ws_lock" = true ]; then
            admin_ready=true
          else
            echo "::warning::admin job skipped: apps/admin has package.json but no lockfile at apps/ or apps/admin/ (will not npm install)"
          fi

          {
            echo "contracts=${has_contracts}"
            echo "backend=${has_backend}"
            echo "web=${web_ready}"
            echo "admin=${admin_ready}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## CI scope"
            echo "- contracts: ${has_contracts}"
            echo "- backend: ${has_backend}"
            echo "- web typecheck: ${web_ready}"
            echo "- admin typecheck: ${admin_ready}"
            echo
            echo "Skipped jobs are incomplete skeleton, not a passing check."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-config:
    name: Deploy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject Higress / ClickHouse in M1 compose and nginx
        run: |
          set -euo pipefail
          if grep -RInE 'higress|clickhouse' deploy/compose deploy/nginx; then
            echo "::error::M1 deploy stack must not include Higress or ClickHouse"
            exit 1
          fi

      - name: Compose config
        run: docker compose --env-file .env.example -f deploy/compose/docker-compose.dev.yml config --quiet

      - name: Nginx config test
        run: |
          docker run --rm \
            -e BACKEND_UPSTREAM=host.docker.internal:8080 \
            -e WEB_UPSTREAM=host.docker.internal:3000 \
            -e ADMIN_UPSTREAM=host.docker.internal:3001 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx/templates/dev.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            nginx:1.27-alpine \
            nginx -t

      - name: Host Nginx snippet test
        run: |
          docker run --rm \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine \
            nginx -t

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.contracts == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python .github/scripts/validate-contracts.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven test
        working-directory: backend
        run: mvn -B -ntp test

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frozen install and typecheck
        run: bash .github/scripts/frontend-typecheck.sh web

  admin:
    name: Admin typecheck
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.admin == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frozen install and typecheck
        run: bash .github/scripts/frontend-typecheck.sh admin

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [detect, deploy-config, contracts, backend, web, admin]
    if: always()
    steps:
      - name: Require executed jobs to pass
        run: |
          set -euo pipefail
          fail=0
          report() {
            local job="$1"
            local result="$2"
            echo "$job=$result"
            echo "- $job: \`$result\`" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              fail=1
            fi
          }
          echo "## Results" >> "$GITHUB_STEP_SUMMARY"
          report detect "${{ needs.detect.result }}"
          report deploy-config "${{ needs.deploy-config.result }}"
          report contracts "${{ needs.contracts.result }}"
          report backend "${{ needs.backend.result }}"
          report web "${{ needs.web.result }}"
          report admin "${{ needs.admin.result }}"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "\`skipped\` means the skeleton is not ready. It is not a green typecheck/test." >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"
