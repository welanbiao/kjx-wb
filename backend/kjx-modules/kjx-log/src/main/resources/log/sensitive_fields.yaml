keys:
  - phone
  - mobile
  - phonenumber
  - phone_number
  - verifycode
  - verify_code
  - sms_code
  - captcha_code
  - authorization
  - cookie
  - set-cookie
  - cookies
  - apikey
  - api_key
  - api-key
  - access_token
  - refresh_token
  - id_token
  - secret
  - secretref
  - secret_ref
  - secret-ref
  - password
  - token
  - credential
  - private_key
patterns:
  - name: phone
    regex: "(?<!\\d)1[3-9]\\d{9}(?!\\d)"
  - name: bearer
    regex: "(?i)bearer\\s+[A-Za-z0-9._\\-+/=]+"
  - name: api_key
    regex: "(?i)(sk-|ak-|api[_-]?key[=:]\\s*)[A-Za-z0-9._\\-+/=]{8,}"
  - name: cookie_header
    regex: "(?i)(cookie|set-cookie)\\s*[:=]\\s*[^\\r\\n]+"
