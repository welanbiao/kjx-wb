# 生产：密钥与数据源一律来自环境变量。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=false&rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  flyway:
    baseline-on-migrate: false

logging:
  level:
    com.koujunxin: WARN
    org.dromara: WARN
