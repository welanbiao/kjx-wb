# 生产：密钥与数据源一律来自环境变量。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=false&rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  flyway:
    baseline-on-migrate: false

kjx:
  captcha:
    enabled: true
  sms:
    mode: ${KJX_SMS_MODE:live}
    provider: ${KJX_SMS_PROVIDER}
    config-id: ${KJX_SMS_CONFIG_ID:kjx}

# SMS4J 凭据只由环境注入；本仓库不写真实密钥。默认 configId=kjx。
sms:
  is-print: false
  config-type: yaml
  blends:
    kjx:
      supplier: ${KJX_SMS_PROVIDER:}
      access-key-id: ${SMS_ACCESS_KEY_ID:}
      access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
      signature: ${SMS_SIGN_NAME:}
      template-id: ${SMS_TEMPLATE_CODE:}

logging:
  level:
    com.koujunxin: WARN
    org.dromara: WARN
    org.dromara.sms4j: WARN
