adminMemberPage:
  get:
    tags:
      - Admin Member
    operationId: pageAdminMembers
    summary: 运营会员分页
    security:
      - AdminBearer: []
    parameters:
      - in: query
        name: deptId
        schema:
          type: integer
          format: int64
      - in: query
        name: douyinId
        schema:
          type: string
      - in: query
        name: memberCode
        schema:
          type: string
      - in: query
        name: status
        schema:
          $ref: "../schemas/member.yaml#/MemberStatus"
      - in: query
        name: bindState
        schema:
          type: integer
          enum:
            - 0
            - 1
      - $ref: "../../schemas/common.yaml#/parameters/PageNoQuery"
      - $ref: "../../schemas/common.yaml#/parameters/PageSizeQuery"
      - $ref: "../../schemas/common.yaml#/parameters/RequestIdHeader"
    responses:
      "200":
        description: 分页会员
        content:
          application/json:
            schema:
              $ref: "../schemas/member.yaml#/AdminMemberPageResponse"
      "401":
        $ref: "../../schemas/common.yaml#/responses/Unauthorized"
      "403":
        $ref: "../../schemas/common.yaml#/responses/Forbidden"

createAdminMember:
  post:
    tags:
      - Admin Member
    operationId: createAdminMember
    summary: 运营录入会员
    description: subscribedMonths、subscribedDays、expireAt 三者均必填，互不换算。
    security:
      - AdminBearer: []
    parameters:
      - $ref: "../../schemas/common.yaml#/parameters/IdempotencyKeyHeader"
      - $ref: "../../schemas/common.yaml#/parameters/RequestIdHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../schemas/member.yaml#/CreateHostMemberRequest"
              - type: object
                required:
                  - deptId
                  - reason
                properties:
                  deptId:
                    type: integer
                    format: int64
                    description: 目标主播部门。
                  reason:
                    $ref: "../../schemas/common.yaml#/schemas/AuditReason"
    responses:
      "200":
        description: 已创建
        content:
          application/json:
            schema:
              $ref: "../schemas/member.yaml#/CreateHostMemberResponse"
      "400":
        $ref: "../../schemas/common.yaml#/responses/BadRequest"
      "401":
        $ref: "../../schemas/common.yaml#/responses/Unauthorized"
      "403":
        $ref: "../../schemas/common.yaml#/responses/Forbidden"

getAdminMember:
  get:
    tags:
      - Admin Member
    operationId: getAdminMember
    summary: 会员详情
    security:
      - AdminBearer: []
    parameters:
      - $ref: "../../schemas/common.yaml#/parameters/IdPath"
      - $ref: "../../schemas/common.yaml#/parameters/RequestIdHeader"
    responses:
      "200":
        description: 会员详情
        content:
          application/json:
            schema:
              $ref: "../schemas/member.yaml#/AdminMemberResponse"
      "401":
        $ref: "../../schemas/common.yaml#/responses/Unauthorized"
      "403":
        $ref: "../../schemas/common.yaml#/responses/Forbidden"
      "404":
        $ref: "../../schemas/common.yaml#/responses/NotFound"

updateAdminMember:
  put:
    tags:
      - Admin Member
    operationId: updateAdminMember
    summary: 修改会员
    description: 修改关键字段必须带 reason 并写 AUDIT。
    security:
      - AdminBearer: []
    parameters:
      - $ref: "../../schemas/common.yaml#/parameters/IdPath"
      - $ref: "../../schemas/common.yaml#/parameters/IdempotencyKeyHeader"
      - $ref: "../../schemas/common.yaml#/parameters/RequestIdHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/member.yaml#/UpdateHostMemberRequest"
    responses:
      "200":
        description: 已更新
        content:
          application/json:
            schema:
              $ref: "../schemas/member.yaml#/AdminMemberResponse"
      "400":
        $ref: "../../schemas/common.yaml#/responses/BadRequest"
      "401":
        $ref: "../../schemas/common.yaml#/responses/Unauthorized"
      "403":
        $ref: "../../schemas/common.yaml#/responses/Forbidden"
      "404":
        $ref: "../../schemas/common.yaml#/responses/NotFound"

adjustEntitlement:
  post:
    tags:
      - Admin Member
    operationId: adjustMemberEntitlement
    summary: 人工增删权益
    description: 同事务增删 entitlement、重算、写 unlock_record(source=official_*)、AUDIT 与 Outbox。
    security:
      - AdminBearer: []
    parameters:
      - $ref: "../../schemas/common.yaml#/parameters/IdPath"
      - $ref: "../../schemas/common.yaml#/parameters/IdempotencyKeyHeader"
