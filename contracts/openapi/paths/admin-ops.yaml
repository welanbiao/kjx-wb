    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../schemas/member.yaml#/ApproveBindingRequest"
    responses:
      "200":
        description: 已通过
        content:
          application/json:
            schema:
              $ref: "../schemas/account.yaml#/OkEmptyResponse"
      "401":
        $ref: "../../schemas/common.yaml#/responses/Unauthorized"
      "403":
