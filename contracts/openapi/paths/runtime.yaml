# WP-42 运行时路径。锚点由 openapi.yaml paths.$ref 引用。

x-session-id: &sessionIdPath
  name: id
  in: path
  required: true
  description: 会话 id，对应控制器 `@PathVariable("id")`。
  schema:
    type: string
    minLength: 1

x-work-code-query: &workCodeQuery
  name: workCode
  in: query
  required: true
  schema:
    $ref: "../../schemas/common.yaml#/schemas/WorkCode"

x-request-id: &requestIdHeader
  $ref: "../../schemas/common.yaml#/parameters/RequestIdHeader"

x-runtime-400: &runtime400
  description: |
    `SCHEMA_MISMATCH` 400；`CHECKSUM_MISMATCH` 400；`UNKNOWN_COMPONENT` 400。
    失败信封 `{code, data.errorName, msg, requestId}`，errorName 见 WP-42，未写入 errors.yaml。
    `code` 与 HTTP 状态相同。
  content:
    application/json:
      schema:
        $ref: "../schemas/runtime.yaml#/RuntimeError"

x-runtime-403: &runtime403
  description: |
    `ENTITLEMENT_REQUIRED` 403；`SESSION_NOT_OWNED` 403；`CROSS_WORK` 403；`CROSS_SESSION` 403；
    `METHOD_NOT_ALLOWED` 403；`NONCE_INVALID` 403；`ORIGIN_REJECTED` 403。
    失败信封 `{code, data.errorName, msg, requestId}`，errorName 见 WP-42，未写入 errors.yaml。
  content:
    application/json:
      schema:
        $ref: "../schemas/runtime.yaml#/RuntimeError"

x-runtime-404: &runtime404
  description: |
    `WORK_PORT_UNAVAILABLE` 404。失败信封 `{code, data.errorName, msg, requestId}`，未写入 errors.yaml。
  content:
    application/json:
      schema:
        $ref: "../schemas/runtime.yaml#/RuntimeError"

x-runtime-409: &runtime409
  description: |
    `SAVE_CONFLICT` 409。失败信封 `{code, data.errorName, msg, requestId}`，未写入 errors.yaml。
  content:
    application/json:
      schema:
        $ref: "../schemas/runtime.yaml#/RuntimeError"

sessions:
  post:
    tags:
      - App Runtime
    operationId: createSession
    summary: 创建作品会话
    description: |
      请求体仅读取 `workCode`。成功信封 `{code:0, data, msg, requestId}`。

      失败 HTTP 状态 + `data.errorName`（WP-42，未写入 errors.yaml）：
      `ENTITLEMENT_REQUIRED` 403；`SESSION_NOT_OWNED` 403；`CROSS_WORK` 403；`CROSS_SESSION` 403；
      `SCHEMA_MISMATCH` 400；`CHECKSUM_MISMATCH` 400；`SAVE_CONFLICT` 409；
      `METHOD_NOT_ALLOWED` 403；`NONCE_INVALID` 403；`ORIGIN_REJECTED` 403；
      `UNKNOWN_COMPONENT` 400；`WORK_PORT_UNAVAILABLE` 404。
    security:
      - AppBearer: []
    parameters:
      - *requestIdHeader
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/runtime.yaml#/CreateSessionRequest"
    responses:
      "200":
        description: 已创建。data 含 payloadJson。
        content:
          application/json:
            schema:
              $ref: "../schemas/runtime.yaml#/SessionDetailResponse"
      "400": *runtime400
      "401":
        $ref: "../../schemas/common.yaml#/responses/Unauthorized"
      "403": *runtime403
      "404": *runtime404
      "409": *runtime409
  get:
    tags:
      - App Runtime
    operationId: listSessions
    summary: 列出作品会话
    description: |
      查询参数 `workCode` 必填。列表项不含 payloadJson。成功信封 `{code:0, data, msg, requestId}`。

      失败 HTTP 状态 + `data.errorName`（WP-42，未写入 errors.yaml）：
      `ENTITLEMENT_REQUIRED` 403；`SESSION_NOT_OWNED` 403；`CROSS_WORK` 403；`CROSS_SESSION` 403；
      `SCHEMA_MISMATCH` 400；`CHECKSUM_MISMATCH` 400；`SAVE_CONFLICT` 409；
      `METHOD_NOT_ALLOWED` 403；`NONCE_INVALID` 403；`ORIGIN_REJECTED` 403；
      `UNKNOWN_COMPONENT` 400；`WORK_PORT_UNAVAILABLE` 404。
    security:
      - AppBearer: []
    parameters:
      - *workCodeQuery
      - *requestIdHeader
    responses:
      "200":
        description: 会话列表
        content:
          application/json:
            schema:
              $ref: "../schemas/runtime.yaml#/SessionListResponse"
      "400": *runtime400
      "401":
        $ref: "../../schemas/common.yaml#/responses/Unauthorized"
      "403": *runtime403
      "404": *runtime404
      "409": *runtime409

