    accountId:
      type: integer
      format: int64
    memberId:
      type: integer
      format: int64
    memberCode:
      $ref: "../../schemas/common.yaml#/schemas/MemberCode"
    douyinIdInput:
      type: string
    claimMonths:
      type: integer
    status:
      type: string
