        - MATCHED
        - REJECTED
        - UNBINDING
    rejectReason:
      type: string
      nullable: true
    matchedAt:
      $ref: "../../schemas/common.yaml#/schemas/NullableDateTime"
    createTime:
      $ref: "../../schemas/common.yaml#/schemas/DateTime"

AdminBindingPageData:
