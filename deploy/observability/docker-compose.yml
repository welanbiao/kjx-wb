name: kjx-obs

# 独立观测栈。禁止被 M1 默认 compose include。
# 仓库根目录：
#   docker compose --env-file .env -f deploy/observability/docker-compose.yml up -d

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: kjx-clickhouse
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - kjx_clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: kjx-otel
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      prometheus:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: kjx-prometheus
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - kjx_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.5.2
    container_name: kjx-grafana
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_HTTP_PORT: 3000
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - kjx_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:3.4.2
    container_name: kjx-loki
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki.yaml:/etc/loki/config.yaml:ro
      - kjx_loki_data:/loki

  tempo:
    image: grafana/tempo:2.7.2
    container_name: kjx-tempo
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - kjx_tempo_data:/var/tempo

volumes:
  kjx_clickhouse_data:
  kjx_prometheus_data:
  kjx_grafana_data:
  kjx_loki_data:
  kjx_tempo_data:
